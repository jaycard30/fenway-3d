<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fenway Park 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    canvas { display: block; }

    /* ── Loading Screen ─────────────────────────────── */
    #loading {
      position: fixed; inset: 0;
      background: #050a05;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .loading-logo {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #CC1C1C;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .loading-sub {
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }
    .loading-bar {
      width: 220px; height: 3px;
      background: #1a2a1a;
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      background: #CC1C1C;
      border-radius: 2px;
      animation: loadpulse 1.6s ease-in-out infinite;
    }
    @keyframes loadpulse {
      0%   { width: 0%; }
      50%  { width: 70%; }
      100% { width: 100%; }
    }

    /* ── Glass Panel Base ───────────────────────────── */
    .panel {
      position: fixed;
      background: rgba(5, 10, 5, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px 16px;
      user-select: none;
    }

    .panel-title {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #CC1C1C;
      margin-bottom: 10px;
    }

    /* ── HUD (top-right) ────────────────────────────── */
    #hud {
      top: 16px; right: 16px;
      min-width: 170px;
    }
    .hud-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.72rem; color: #bbb;
      margin-bottom: 5px;
    }
    .hud-row:last-child { margin-bottom: 0; }
    .key {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      font-size: 0.65rem; font-weight: 600;
      padding: 1px 6px; min-width: 22px;
      color: #fff;
    }

    /* ── Camera Presets (bottom-left) ───────────────── */
    #cameras {
      bottom: 16px; left: 16px;
      min-width: 150px;
    }
    .cam-btn {
      display: block; width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #ddd; font-size: 0.75rem;
      padding: 7px 12px; margin-bottom: 6px;
      cursor: pointer; text-align: left;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .cam-btn:last-child { margin-bottom: 0; }
    .cam-btn:hover { background: rgba(204,28,28,0.2); border-color: #CC1C1C; color: #fff; }
    .cam-btn.active { background: rgba(204,28,28,0.35); border-color: #CC1C1C; color: #fff; }

    /* ── Time of Day (bottom-right) ─────────────────── */
    #time-panel {
      bottom: 16px; right: 16px;
      min-width: 220px;
    }
    .time-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    #time-label {
      font-size: 0.72rem; color: #bbb;
    }
    #crowd-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 5px;
      color: #ccc; font-size: 0.65rem;
      padding: 3px 8px; cursor: pointer;
      transition: background 0.15s;
    }
    #crowd-btn:hover { background: rgba(204,28,28,0.25); border-color: #CC1C1C; color: #fff; }

    #time-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 5px;
      border-radius: 3px;
      background: linear-gradient(to right, #87CEEB 0%, #FFD070 38%, #FF6030 65%, #060618 100%);
      outline: none; cursor: pointer;
      margin-bottom: 6px;
    }
    #time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #CC1C1C;
      cursor: pointer;
    }
    #time-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #CC1C1C;
      cursor: pointer;
    }

    .time-marks {
      display: flex; justify-content: space-between;
      font-size: 0.58rem; color: #777;
    }

    /* ── Scoreboard Panel (top-left) ─────────────────── */
    #scoreboard-panel {
      top: 16px; left: 16px;
      min-width: 200px;
    }
    .sb-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .sb-row:last-child { margin-bottom: 0; }
    .sb-team {
      font-size: 0.68rem; color: #bbb;
      width: 60px; flex-shrink: 0;
    }
    .sb-score {
      display: flex; gap: 4px;
    }
    .sb-cell {
      width: 18px; height: 22px;
      background: #0e1a0e;
      border: 1px solid #2a3a2a;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; color: #eee;
      cursor: pointer;
      transition: background 0.1s;
    }
    .sb-cell:hover { background: #1a2e1a; border-color: #CC1C1C; }
    .sb-cell.active { background: #1e3a1e; border-color: #CC1C1C; color: #CC1C1C; }
    .sb-inning {
      font-size: 0.6rem; color: #666;
      display: flex; gap: 4px; margin-top: 2px;
    }
    .sb-inn-num {
      width: 18px; text-align: center;
    }
    .sb-label-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 3px;
    }
    .sb-spacer { width: 60px; flex-shrink: 0; }

    /* ── Tooltip ──────────────────────────────────────── */
    #tooltip {
      position: fixed;
      background: rgba(5, 10, 5, 0.88);
      border: 1px solid rgba(204, 28, 28, 0.5);
      border-radius: 8px;
      padding: 10px 14px;
      max-width: 240px;
      pointer-events: none;
      display: none;
      z-index: 50;
    }
    #tooltip strong {
      display: block;
      font-size: 0.78rem;
      color: #CC1C1C;
      margin-bottom: 4px;
    }
    #tooltip p {
      font-size: 0.7rem;
      color: #bbb;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="loading-logo">Fenway Park</div>
  <div class="loading-sub">Est. 1912 · Boston, MA</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<!-- HUD -->
<div class="panel" id="hud">
  <div class="panel-title">Controls</div>
  <div class="hud-row"><span class="key">drag</span> Rotate view</div>
  <div class="hud-row"><span class="key">scroll</span> Zoom</div>
  <div class="hud-row"><span class="key">R-drag</span> Pan</div>
  <div class="hud-row"><span class="key">click</span> Inspect</div>
  <div class="hud-row"><span class="key">T</span> Toggle crowd</div>
</div>

<!-- Scoreboard Panel -->
<div class="panel" id="scoreboard-panel">
  <div class="panel-title">Manual Scoreboard</div>
  <div class="sb-label-row">
    <div class="sb-spacer"></div>
    <div class="sb-inning" id="inning-labels"></div>
  </div>
  <div class="sb-row">
    <div class="sb-team">VISITOR</div>
    <div class="sb-score" id="score-away"></div>
  </div>
  <div class="sb-row">
    <div class="sb-team">RED SOX</div>
    <div class="sb-score" id="score-home"></div>
  </div>
</div>

<!-- Camera Presets -->
<div class="panel" id="cameras">
  <div class="panel-title">Camera</div>
  <button class="cam-btn" data-cam="pressbox">Press Box</button>
  <button class="cam-btn" data-cam="homeplate">Home Plate</button>
  <button class="cam-btn" data-cam="greenmonster">Green Monster</button>
  <button class="cam-btn" data-cam="centerfield">Center Field</button>
  <button class="cam-btn" data-cam="aerial">Bird's Eye</button>
</div>

<!-- Time of Day -->
<div class="panel" id="time-panel">
  <div class="panel-title">
    <div class="time-header">
      <span>Time of Day</span>
      <button id="crowd-btn">Hide Crowd</button>
    </div>
  </div>
  <input type="range" id="time-slider" min="0" max="100" value="15" />
  <div class="time-marks">
    <span>Afternoon</span>
    <span>Golden Hour</span>
    <span>Dusk</span>
    <span>Night</span>
  </div>
  <div style="text-align:center; margin-top:6px; font-size:0.7rem; color:#888;" id="time-label">Afternoon</div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <strong id="tooltip-title"></strong>
  <p id="tooltip-body"></p>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
